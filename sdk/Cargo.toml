[package]
name        = "chip-voting-sdk"
version     = "0.1.0"
edition     = "2021"
description = "Reference Rust driver for the Chia voting CHIP (Election Singleton + CAT-collateralized Registration Coin + Groth16 finalization)."
license     = "MIT"

# ── FEATURES ────────────────────────────────────────────────────────
# `native` (default-on) gates everything that pulls in non-portable C
# / OS-socket dependencies: `chia-query` (mio + native-tls peer pool),
# `dig-l1-wallet` (openssl + raw TCP), and `tokio`'s socket-bearing
# features (`rt-multi-thread`, `net`, `io-util`). Wasm callers
# disable the feature (`default-features = false`) so the
# wasm32-unknown-unknown build does not pull mio / openssl-sys /
# tokio-net into the dependency graph.
#
# What stays unconditional (wasm-buildable):
#   * Pure CLVM / BLS / Groth16 prover stack
#   * `puzzles`, `merkle`, `action_spends`, `state`, `config`,
#     `ceremony`, `prover`, `error`
#   * The bare `tokio` `sync` / `macros` / `time` features (these
#     compile on wasm32 because they have no socket / mio backing).
#
# What `native` enables (gated as `#[cfg(feature = "native")]`):
#   * The whole `actors` module (Aggregator, Voter, ElectionDeployer,
#     Indexer, BallotIssuer, BallotReader). All four actors take a
#     `dig_l1_wallet::NetworkType` and the chain-walking ones default
#     their generic to `chia_query::ChiaQuery`.
#   * The `ChainReader` impls in `chain.rs` for `chia_query::ChiaQuery`
#     and `chia_query::coinset::CoinsetClient`. The `ChainReader`
#     trait itself, the `ChainCoinRecord` struct, and the simulator
#     impl stay unconditional.
#   * The top-level `verify_bundle_signatures` helper (uses
#     `dig_l1_wallet::transaction::get_agg_sig_data`).
#   * The `pub use chia_query::*` / `pub use dig_l1_wallet::*`
#     re-exports.
[features]
default = ["native"]
native = [
    "dep:chia",
    "dep:chia-query",
    "dep:dig-l1-wallet",
    "dep:chia-wallet-sdk",
    "chia-wallet-sdk/native-tls",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/io-util",
]

[dependencies]
# ── Low-level Chia primitives (0.26 line, matching dig-l1-wallet) ───
# `chia` is the umbrella crate; not used directly in SDK source — we
# pull each sub-crate individually below. With default features it
# transitively pulls in `chia-ssl` (→ rcgen → ring::SystemRandom)
# which fails to build for wasm32. Mark it optional + gate it behind
# `native` so the wasm build skips it entirely.
chia              = { version = "0.26", optional = true }
chia-protocol     = { version = "0.26", features = ["serde"] }
chia-puzzles      = "0.20"   # compiled standard puzzle bytecode + tree hashes (CAT_PUZZLE_HASH, etc.)
chia-puzzle-types = "0.26"   # CatArgs, SingletonStruct, StandardArgs
chia-bls          = "0.26"
chia-consensus    = "0.26"   # validate_clvm_and_signature — surfaces actual mempool ErrorCode locally instead of opaque "FAILED" from full nodes
clvm-traits       = "0.26"
clvm-utils        = "0.26"   # CurriedProgram, ToTreeHash, tree_hash_atom, tree_hash_pair
clvmr             = "0.14"   # NOTE: clvmr 0.14 (what chia-sdk-driver 0.30 transitively requires) does NOT enforce the mempool-mode `DISABLE_OP` guard on `op_modpow` (60). Mainnet does — `op_modpow` is rejected at mempool admission with `GENERATOR_RUNTIME_ERROR`. Avoid `modpow` in on-chain puzzles; use `%` (op_mod, 61) instead, which is mempool-safe.

# ── chia-wallet-sdk umbrella + sub-crates ──────────────────────────
# Drivers (SpendContext, Launcher, Cat, CatSpend, StandardLayer, Singleton,
# ActionLayer/ActionLayerSolution, Spends, Spend) + signing + types.
#
# The umbrella `chia-wallet-sdk` re-exports the same types AND
# unconditionally pulls in `chia-sdk-client` / `chia-sdk-coinset` /
# `chia-sdk-test` (peer-talk + simulator), which transitively bring
# in `chia-ssl` (rcgen → ring::SystemRandom) and `tokio` net features
# that don't compile for wasm32. The wasm build accesses driver
# types via the individually-listed sub-crates (`chia-sdk-driver`
# etc.) directly; the umbrella is only needed when we want to flip
# its `native-tls` feature on for production builds. Mark it
# optional + gate it behind `native`.
chia-wallet-sdk = { version = "0.30", default-features = false, features = ["action-layer"], optional = true }
chia-sdk-driver = "0.30"     # SpendContext, Layer, Primitive, ActionLayer, etc.
chia-sdk-signer = "0.30"     # RequiredSignature::from_coin_spends — walks AGG_SIG_* conditions
chia-sdk-types  = "0.30"     # Conditions enum, MerkleTree, MerkleProof, run_puzzle helper
chia-sdk-utils  = "0.30"     # Address (bech32m), select_coins (knapsack)

# ── Chain I/O + wallet (native-only — gated behind `native`) ────────
# Both crates pull mio / native-tls / openssl / raw tokio sockets and
# do not compile for wasm32-unknown-unknown. They are `optional = true`
# and only enabled when the `native` feature is on (the default).
chia-query    = { version = "0.2", optional = true }   # decentralised peers + coinset.org HTTP fallback
dig-l1-wallet = { version = "0.1", optional = true }   # XCH + CAT wallet (encrypted keystore, BIP39, coin selection)

# ── Groth16 + curve (off-chain prover; on-chain verify is in CLVM) ─
# `std` enables the standard library backed implementations needed for
# the prover. ark-bls12-381 needs the `curve` feature for full
# arithmetic. ark-groth16 needs `parallel` to enable
# `Groth16::generate_parameters_with_reduction` etc.
ark-groth16           = { version = "0.4", default-features = false, features = ["std"] }
ark-bls12-381         = { version = "0.4", default-features = false, features = ["std", "curve"] }
ark-r1cs-std          = { version = "0.4", default-features = false, features = ["std"] }
ark-relations         = { version = "0.4", default-features = false, features = ["std"] }
ark-ff                = { version = "0.4", default-features = false, features = ["std"] }
ark-ec                = { version = "0.4", default-features = false, features = ["std"] }
ark-std               = { version = "0.4", default-features = false, features = ["std"] }
ark-serialize         = { version = "0.4", default-features = false, features = ["std"] }
ark-crypto-primitives = { version = "0.4", default-features = false, features = ["std", "crh", "r1cs"] }
ark-snark             = { version = "0.4", default-features = false }

# BLS aggregation (off-chain) — augmented signing matches on-chain bls_verify.
blst = "0.3"

# ── Standard utility ────────────────────────────────────────────────
hex          = "0.4"
sha2         = "0.10"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
thiserror    = "2.0"
tracing      = "0.1"
async-trait  = "0.1"
indexmap     = "2"
hex-literal  = "0.4"
tokio        = { version = "1", default-features = false, features = ["macros", "sync", "time"] }
# `web_time::Instant` works on both native (re-exports `std::time`) and
# wasm32-unknown-unknown (uses the browser/Node `performance.now()`
# API). Drop-in replacement for `std::time::Instant`.
web-time     = "1"

# wasm32-only async sleep that uses `setTimeout` under the hood. The
# native target keeps using `tokio::time::sleep` (so the chia simulator
# tests don't change behaviour).
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers  = { version = "0.3", features = ["futures"] }

[build-dependencies]
hex = "0.4"

[dev-dependencies]
# Wallet simulator for in-process end-to-end tests. Provides a fake
# Chia node that accepts SpendBundles, runs CLVM, advances height, and
# exposes coin_state / coin_spend lookups — same harness chia-sdk-driver
# uses for its own integration tests. Optional dep so prod builds can
# omit it; enabled automatically as a dev-dep below.
chia-sdk-test = "0.30"
tokio-test = "0.4"
tracing-subscriber = "0.3"
anyhow = "1"
rand = "0.8"
indexmap = "2"
